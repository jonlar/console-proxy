services:
  console-proxy:
    image: ghcr.io/jonlar/console-proxy:latest
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
      - PORT=80
      - CONFIG_PATH=/data/config.json
    volumes:
      - console-proxy-data:/data
    restart: unless-stopped
    container_name: console-proxy

volumes:
  console-proxy-data:
