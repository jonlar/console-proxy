services:
  console-proxy:
    image: ghcr.io/jonlar/console-proxy:latest
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
    volumes:
      - console-proxy-data:/data
    command: ["--port", "80", "--data-dir", "/data"]
    restart: unless-stopped
    container_name: console-proxy

volumes:
  console-proxy-data:
