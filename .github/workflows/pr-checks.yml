name: PR Checks

on:
  pull_request:
    branches: [ main ]

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      
      - name: Install dependencies
        run: bun install
      
      - name: Install workspace dependencies
        run: |
          cd packages/backend && bun install
          cd ../frontend && bun install
      
      - name: Run Biome lint
        run: bunx @biomejs/biome lint --error-on-warnings .
      
      - name: Run Biome format check
        run: bunx @biomejs/biome format --error-on-warnings .
